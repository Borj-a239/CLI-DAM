[project]
name = "dam"
version = "1.0.0"
description = "Asistente de navegación, plantillas y acciones con ficheros para DAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alumno DAM" }]
dependencies = [
    "prompt_toolkit>=3.0",
    "pdfplumber>=0.9",
    "python-docx>=0.8",
    "odfpy>=1.4",
    "pypdf>=3.0",
    "typer>=0.20",
]

[project.scripts]
dam = "dam.cli:app"
_dam = "dam.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dam*"]
